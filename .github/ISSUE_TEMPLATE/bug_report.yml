name: Bug 反馈
description: 站点显示异常、搜索/署名/积分等功能不对，或部署后跑不起来
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量把环境填全，很多问题只在不带缓存的页面或某个版本上出现。
        > 注意：刻意删除或改写页脚署名、「了解 Pro」入口，属于违反《社区版授权条款》，不作为 Bug 处理；这类改动会被运行时自动还原。

  - type: dropdown
    id: edition
    attributes:
      label: 使用的是哪个版本
      options:
        - 社区版（本仓库 / GitHub Pages 静态部署）
        - Docker 版（r6t5-docs-docker，含专业版授权）
        - 专业版 / 订制版分发包（zip）
        - 自己改过的 fork
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: 填 zip 版本号（如 v1.3）、镜像 tag，或 commit 短哈希
      placeholder: 例如 v1.3 / ghcr.io/tanchipanda/r6t5-docs-docker:latest / 25291d9
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 浏览器与系统
      placeholder: 例如 Chrome 131 / macOS 15、Safari iOS 18
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开哪个页面开始，一步一步写清楚；带 `?path=` 参数的话请贴完整 URL
      placeholder: |
        1. 打开 https://xxx.github.io/r6t5-docs/?path=docs/index.md
        2. 按 ⌘K 输入「目录」
        3. ……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有报错就把 Console 报错贴上来（不要贴 token、key、密码）
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 截图 / 补充信息
      description: 可直接拖拽图片；涉及部署问题时附上启动日志（隐去敏感信息）
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索过现有 Issue，没有重复
          required: true
        - label: 已强制刷新 / 清缓存后重新验证过
          required: true
